<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Color Mixer</title>
  <style>
    :root {
      --bg: #0a0a1a;
      --card: #12122a;
      --border: #2a2a4a;
      --text: #e0e0ff;
      --muted: #8888bb;
      --accent: #a855f7;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    /* Particles */
    .particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .particle { position: absolute; border-radius: 50%; opacity: 0.1; animation: float linear infinite; }
    @keyframes float {
      from { transform: translateY(110vh) rotate(0deg); opacity: 0; }
      10% { opacity: 0.15; } 90% { opacity: 0.1; }
      to { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
    }

    /* App shell */
    .app {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      height: 100dvh;
      max-width: 500px; margin: 0 auto;
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* ── Screens ── */
    .screen {
      flex: 1; overflow: hidden;
      display: none; flex-direction: column;
      min-height: 0;
    }
    .screen.active { display: flex; }

    /* ── Bottom nav ── */
    .bottom-nav {
      flex: 0 0 auto;
      display: flex;
      border-top: 1px solid var(--border);
      background: rgba(10,10,26,0.97);
      backdrop-filter: blur(12px);
    }
    .nav-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 3px;
      padding: 0.5rem 0.25rem;
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 0.65rem; font-weight: 600;
      transition: color 0.2s;
    }
    .nav-btn .icon { font-size: 1.3rem; line-height: 1; }
    .nav-btn.active { color: var(--accent); }

    /* ════════════════════════════
       MIXER SCREEN
    ════════════════════════════ */
    #screen-mixer {
      padding: 0.75rem 1rem 0.5rem;
      background-image:
        radial-gradient(ellipse at 20% 10%, rgba(255,50,50,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 90%, rgba(50,50,255,0.08) 0%, transparent 50%);
    }

    .mixer-header {
      text-align: center; margin-bottom: 0.6rem; flex-shrink: 0;
    }
    .mixer-header h1 {
      font-size: 1.2rem; font-weight: 900; letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ff6b6b, #a855f7, #3b82f6, #22c55e);
      background-size: 300% 300%;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      animation: gradientShift 4s ease infinite;
    }
    @keyframes gradientShift {
      0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; }
    }

    /* Big color swatch */
    .big-preview {
      flex: 1; border-radius: 24px; min-height: 0;
      position: relative; overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5), inset 0 2px 6px rgba(255,255,255,0.15);
      transition: background-color 0.1s;
      cursor: pointer;
      margin-bottom: 0.75rem;
    }
    .big-preview::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%);
      pointer-events: none;
    }
    .preview-info {
      position: absolute; bottom: 0.75rem; left: 0; right: 0;
      text-align: center;
    }
    .color-hex {
      font-size: 1.4rem; font-weight: 900; letter-spacing: 2px;
      font-family: 'Courier New', monospace; cursor: pointer;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }
    .color-name { font-size: 0.85rem; opacity: 0.75; margin-top: 2px; }

    /* Harmony chips inside preview */
    .harmony-row {
      position: absolute; top: 0.75rem; left: 0.75rem; right: 0.75rem;
      display: flex; gap: 5px; flex-wrap: wrap; align-items: center;
    }
    .harmony-label {
      font-size: 0.55rem; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; color: rgba(255,255,255,0.5);
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
      margin-left: 2px;
    }
    .harmony-chip {
      width: 26px; height: 26px; border-radius: 8px; cursor: pointer;
      border: 2px solid rgba(255,255,255,0.25); transition: transform 0.15s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    .harmony-chip:active { transform: scale(0.88); }

    /* Sliders */
    .sliders-section { flex-shrink: 0; display: flex; flex-direction: column; gap: 0.5rem; }
    .slider-group { display: flex; flex-direction: column; gap: 3px; }
    .slider-label { display: flex; justify-content: space-between; align-items: center; }
    .slider-label .lbl {
      font-weight: 700; font-size: 0.8rem; display: flex; align-items: center; gap: 6px;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .value-badge {
      background: rgba(255,255,255,0.07); border: 1px solid var(--border);
      border-radius: 6px; padding: 1px 8px; font-size: 0.75rem;
      font-family: monospace; font-weight: 700; min-width: 2.4rem; text-align: center;
    }
    input[type=range] {
      -webkit-appearance: none; width: 100%; height: 10px;
      border-radius: 999px; outline: none; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%;
      background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.5), 0 0 0 2px rgba(255,255,255,0.2);
      cursor: grab; transition: transform 0.1s;
    }
    input[type=range]:active::-webkit-slider-thumb { transform: scale(1.2); }
    @media (hover: none) {
      input[type=range] { height: 12px; }
      input[type=range]::-webkit-slider-thumb { width: 34px; height: 34px; }
    }

    /* Action buttons */
    .btn-row { display: flex; gap: 0.5rem; margin-top: 0.4rem; flex-shrink: 0; }
    .btn {
      flex: 1; padding: 0.6rem 0.25rem; border: none; border-radius: 12px;
      font-size: 0.8rem; font-weight: 700; cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.95); opacity: 0.85; }
    .btn-primary { background: linear-gradient(135deg, #a855f7, #3b82f6); color: #fff; box-shadow: 0 3px 12px rgba(168,85,247,0.35); }
    .btn-secondary { background: rgba(255,255,255,0.07); border: 1px solid var(--border); color: var(--text); }

    /* ════════════════════════════
       RECIPES SCREEN
    ════════════════════════════ */
    .screen-header {
      flex-shrink: 0; padding: 0.9rem 1rem 0.5rem;
      font-size: 0.7rem; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; color: var(--muted);
    }
    .screen-scroll { flex: 1; overflow-y: auto; padding: 0 0.75rem 0.75rem; min-height: 0; }

    .suggest-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem;
    }
    .suggest-card {
      border-radius: 12px; padding: 0.6rem;
      border: 1px solid var(--border); cursor: pointer;
      background: var(--card); user-select: none;
      transition: transform 0.15s, border-color 0.15s;
    }
    .suggest-card:active { transform: scale(0.94); border-color: rgba(255,255,255,0.2); }
    .suggest-swatch {
      width: 100%; height: 48px; border-radius: 8px; margin-bottom: 0.4rem;
      position: relative; overflow: hidden;
    }
    .suggest-swatch::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 60%);
    }
    .suggest-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; }
    .suggest-hex { font-size: 0.6rem; color: var(--muted); font-family: monospace; }

    /* ════════════════════════════
       RECENT SCREEN
    ════════════════════════════ */
    .recent-grid { display: flex; flex-wrap: wrap; gap: 0.6rem; }
    .recent-swatch {
      width: 56px; height: 56px; border-radius: 12px; cursor: pointer;
      border: 2px solid transparent; transition: transform 0.15s, border-color 0.15s;
      position: relative; overflow: hidden; flex-shrink: 0;
    }
    .recent-swatch::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 60%);
    }
    .recent-swatch:active { transform: scale(0.9); border-color: rgba(255,255,255,0.4); }
    .empty-msg { color: var(--muted); font-size: 0.85rem; font-style: italic; }

    /* ════════════════════════════
       MIX SCREEN
    ════════════════════════════ */
    .mix-zone {
      border: 2px dashed var(--border); border-radius: 16px; padding: 1.25rem;
      text-align: center; min-height: 100px;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 0.6rem;
      transition: border-color 0.2s, background 0.2s; position: relative;
    }
    .mix-zone.drag-over { border-color: rgba(168,85,247,0.7); background: rgba(168,85,247,0.08); }
    .mix-zone-result { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; justify-content: center; }
    .mix-chip { width: 56px; height: 56px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.15); cursor: pointer; }
    .mix-arrow { font-size: 1.4rem; color: var(--muted); }
    .mix-result-swatch { width: 72px; height: 72px; border-radius: 14px; border: 2px solid rgba(255,255,255,0.2); cursor: pointer; transition: background-color 0.3s; }
    .mix-clear { position: absolute; top: 0.6rem; right: 0.6rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 6px; color: var(--muted); padding: 3px 10px; cursor: pointer; font-size: 0.7rem; }
    .mix-hint { color: var(--muted); font-size: 0.8rem; line-height: 1.5; }

    /* Toast */
    .toast {
      position: fixed; bottom: 5.5rem; left: 50%; transform: translateX(-50%) translateY(60px);
      background: rgba(30,30,60,0.95); border: 1px solid rgba(168,85,247,0.4);
      border-radius: 12px; padding: 0.55rem 1.2rem;
      font-size: 0.85rem; font-weight: 600; z-index: 1000;
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
      opacity: 0; pointer-events: none; backdrop-filter: blur(12px); white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="app">

  <!-- ── MIXER ── -->
  <div class="screen active" id="screen-mixer">
    <div class="mixer-header"><h1>🎨 Color Mixer</h1></div>

    <div class="big-preview" id="preview" draggable="true">
      <div class="harmony-row" id="harmony-row"></div>
      <div class="preview-info">
        <div class="color-hex" id="hex-display">#FF0000</div>
        <div class="color-name" id="color-name">Red</div>
      </div>
    </div>

    <div class="sliders-section">
      <div class="slider-group">
        <div class="slider-label">
          <span class="lbl"><span class="dot" style="background:#ff4444;box-shadow:0 0 6px #ff4444;"></span>Red</span>
          <span class="value-badge" id="r-val">255</span>
        </div>
        <input type="range" id="slider-r" min="0" max="255" value="255" />
      </div>
      <div class="slider-group">
        <div class="slider-label">
          <span class="lbl"><span class="dot" style="background:#44ff44;box-shadow:0 0 6px #44ff44;"></span>Green</span>
          <span class="value-badge" id="g-val">0</span>
        </div>
        <input type="range" id="slider-g" min="0" max="255" value="0" />
      </div>
      <div class="slider-group">
        <div class="slider-label">
          <span class="lbl"><span class="dot" style="background:#4488ff;box-shadow:0 0 6px #4488ff;"></span>Blue</span>
          <span class="value-badge" id="b-val">0</span>
        </div>
        <input type="range" id="slider-b" min="0" max="255" value="0" />
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="random-btn">🎲 Random</button>
      <button class="btn btn-secondary" id="save-btn">💾 Save</button>
      <button class="btn btn-secondary" id="mix-btn">🧪 Mix</button>
    </div>
  </div>

  <!-- ── RECIPES ── -->
  <div class="screen" id="screen-recipes">
    <div class="screen-header">Color Recipes</div>
    <div class="screen-scroll">
      <div class="suggest-grid" id="suggest-grid"></div>
    </div>
  </div>

  <!-- ── RECENT ── -->
  <div class="screen" id="screen-recent">
    <div class="screen-header">Recent Colors</div>
    <div class="screen-scroll">
      <div class="recent-grid" id="recent-grid">
        <span class="empty-msg">No colors saved yet — move sliders and tap Save!</span>
      </div>
    </div>
  </div>

  <!-- ── MIX ── -->
  <div class="screen" id="screen-mix">
    <div class="screen-header">Mix Zone</div>
    <div class="screen-scroll">
      <div class="mix-zone" id="mix-zone">
        <div id="mix-prompt" class="mix-hint">
          Tap <strong style="color:var(--text)">🧪 Mix</strong> on the mixer to add colors here, then blend them
        </div>
        <div class="mix-zone-result" id="mix-result" style="display:none;"></div>
      </div>
    </div>
  </div>

  <!-- ── Bottom nav ── -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-screen="mixer">
      <span class="icon">🎨</span>Mixer
    </button>
    <button class="nav-btn" data-screen="recipes">
      <span class="icon">🍳</span>Recipes
    </button>
    <button class="nav-btn" data-screen="recent">
      <span class="icon">🕒</span>Recent
    </button>
    <button class="nav-btn" data-screen="mix">
      <span class="icon">🧪</span>Mix
    </button>
  </nav>

</div>

<div class="toast" id="toast"></div>

<script>
let r = 255, g = 0, b = 0;
let recentColors = JSON.parse(localStorage.getItem('colorMixerRecent') || '[]');
let mixSlot = [null, null];
let dragSourceColor = null;

const colorNames = [
  {name:'Red',r:255,g:0,b:0},{name:'Green',r:0,g:128,b:0},{name:'Blue',r:0,g:0,b:255},
  {name:'Yellow',r:255,g:255,b:0},{name:'Cyan',r:0,g:255,b:255},{name:'Magenta',r:255,g:0,b:255},
  {name:'Orange',r:255,g:165,b:0},{name:'Purple',r:128,g:0,b:128},{name:'Pink',r:255,g:105,b:180},
  {name:'Lime',r:0,g:255,b:0},{name:'Teal',r:0,g:128,b:128},{name:'Coral',r:255,g:127,b:80},
  {name:'Gold',r:255,g:215,b:0},{name:'Crimson',r:220,g:20,b:60},{name:'Sky Blue',r:135,g:206,b:235},
  {name:'Mint',r:62,g:180,b:137},{name:'Lavender',r:150,g:123,b:182},{name:'Salmon',r:250,g:128,b:114},
  {name:'Indigo',r:75,g:0,b:130},{name:'White',r:255,g:255,b:255},{name:'Black',r:0,g:0,b:0},
  {name:'Gray',r:128,g:128,b:128},{name:'Brown',r:139,g:69,b:19},{name:'Olive',r:107,g:142,b:35},
  {name:'Navy',r:0,g:0,b:128},{name:'Maroon',r:128,g:0,b:0},{name:'Turquoise',r:64,g:224,b:208},
  {name:'Violet',r:238,g:130,b:238},{name:'Chartreuse',r:127,g:255,b:0},{name:'Azure',r:0,g:127,b:255},
];

const SUGGESTIONS = [
  {label:'Fire Red',r:255,g:30,b:0},{label:'Ocean',r:0,g:105,b:255},{label:'Jungle',r:15,g:180,b:70},
  {label:'Sunset',r:255,g:120,b:40},{label:'Purple',r:160,g:20,b:220},{label:'Teal',r:0,g:200,b:180},
  {label:'Hot Pink',r:255,g:20,b:147},{label:'Gold',r:255,g:210,b:0},{label:'Sky',r:100,g:180,b:255},
  {label:'Mint',r:50,g:220,b:140},{label:'Choc',r:160,g:70,b:10},{label:'Violet',r:200,g:50,b:255},
];

function toHex(rr,gg,bb){return'#'+[rr,gg,bb].map(v=>v.toString(16).padStart(2,'0').toUpperCase()).join('');}
function luminance(rr,gg,bb){return 0.299*rr+0.587*gg+0.114*bb;}
function hsvToRgb(h,s,v){
  h=((h%360)+360)%360;
  const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;
  let rr=0,gg=0,bb=0;
  if(h<60){rr=c;gg=x;}else if(h<120){rr=x;gg=c;}else if(h<180){gg=c;bb=x;}
  else if(h<240){gg=x;bb=c;}else if(h<300){rr=x;bb=c;}else{rr=c;bb=x;}
  return[Math.round((rr+m)*255),Math.round((gg+m)*255),Math.round((bb+m)*255)];
}
function rgbToHsv(rr,gg,bb){
  rr/=255;gg/=255;bb/=255;
  const max=Math.max(rr,gg,bb),min=Math.min(rr,gg,bb),d=max-min;
  let h=0;const s=max===0?0:d/max,v=max;
  if(d){
    if(max===rr)h=(gg-bb)/d+(gg<bb?6:0);
    else if(max===gg)h=(bb-rr)/d+2;
    else h=(rr-gg)/d+4;
    h*=60;
  }
  return[h,s,v];
}
function blendColors(r1,g1,b1,r2,g2,b2){return[Math.round((r1+r2)/2),Math.round((g1+g2)/2),Math.round((b1+b2)/2)];}
function getClosestName(rr,gg,bb){
  let best=colorNames[0],bestDist=Infinity;
  for(const c of colorNames){const d=(c.r-rr)**2+(c.g-gg)**2+(c.b-bb)**2;if(d<bestDist){bestDist=d;best=c;}}
  return best.name;
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

function switchScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.querySelector(`[data-screen="${name}"]`).classList.add('active');
}

document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click',()=>switchScreen(btn.dataset.screen));
});

function update(){
  const hex=toHex(r,g,b);
  const lum=luminance(r,g,b);
  const preview=document.getElementById('preview');
  preview.style.backgroundColor=hex;
  preview.style.boxShadow=`0 8px 40px rgba(${r},${g},${b},0.5), inset 0 2px 6px rgba(255,255,255,0.15)`;
  const hexEl=document.getElementById('hex-display');
  hexEl.textContent=hex;
  hexEl.style.color=lum<60?'rgba(255,255,255,0.9)':'rgba(0,0,0,0.75)';
  document.getElementById('color-name').style.color=lum<60?'rgba(255,255,255,0.6)':'rgba(0,0,0,0.5)';
  document.getElementById('color-name').textContent=getClosestName(r,g,b);
  document.getElementById('r-val').textContent=r;
  document.getElementById('g-val').textContent=g;
  document.getElementById('b-val').textContent=b;
  document.getElementById('slider-r').style.background=`linear-gradient(to right,#1a0000,rgb(${r},0,0))`;
  document.getElementById('slider-g').style.background=`linear-gradient(to right,#001a00,rgb(0,${g},0))`;
  document.getElementById('slider-b').style.background=`linear-gradient(to right,#00001a,rgb(0,0,${b}))`;
  buildHarmony();
}

function buildHarmony(){
  const row=document.getElementById('harmony-row');
  row.innerHTML='';
  const[h,s,v]=rgbToHsv(r,g,b);
  const harmonies=[{t:'Complementary',a:180},{t:'Triadic',a:120},{t:'Triadic',a:240},{t:'Analogous',a:30},{t:'Analogous',a:-30},{t:'Split',a:150},{t:'Split',a:210}];
  for(const harm of harmonies){
    const[rr,gg,bb]=hsvToRgb(h+harm.a,Math.max(0.2,s),Math.max(0.4,v));
    const chip=document.createElement('div');
    chip.className='harmony-chip';
    chip.style.background=toHex(rr,gg,bb);
    chip.title=`${harm.t}: ${toHex(rr,gg,bb)}`;
    chip.addEventListener('click',()=>applyColor(rr,gg,bb));
    row.appendChild(chip);
  }
  const lbl=document.createElement('span');
  lbl.className='harmony-label';
  lbl.textContent='✨ tap a color, it\'ll look cool together';
  row.appendChild(lbl);
}

function applyColor(rr,gg,bb){
  r=rr;g=gg;b=bb;
  document.getElementById('slider-r').value=r;
  document.getElementById('slider-g').value=g;
  document.getElementById('slider-b').value=b;
  update();
  const p=document.getElementById('preview');
  p.style.transform='scale(1.02)';
  setTimeout(()=>p.style.transform='',180);
}

['r','g','b'].forEach(ch=>{
  document.getElementById(`slider-${ch}`).addEventListener('input',function(){
    if(ch==='r')r=+this.value;
    if(ch==='g')g=+this.value;
    if(ch==='b')b=+this.value;
    update();
  });
});

document.getElementById('hex-display').addEventListener('click',()=>{
  const hex=toHex(r,g,b);
  navigator.clipboard.writeText(hex).then(()=>showToast(`Copied ${hex}!`)).catch(()=>showToast(hex));
});

document.getElementById('random-btn').addEventListener('click',()=>{
  applyColor(Math.floor(Math.random()*256),Math.floor(Math.random()*256),Math.floor(Math.random()*256));
  showToast('🎲 Random color!');
});

document.getElementById('save-btn').addEventListener('click',()=>saveToRecent(r,g,b));

document.getElementById('mix-btn').addEventListener('click',()=>{
  if(!mixSlot[0]){mixSlot[0]={r,g,b};}
  else if(!mixSlot[1]){mixSlot[1]={r,g,b};}
  else{mixSlot[0]=mixSlot[1];mixSlot[1]={r,g,b};}
  renderMixZone();
  switchScreen('mix');
  showToast('Added to mix!');
});

function saveToRecent(rr,gg,bb){
  const hex=toHex(rr,gg,bb);
  recentColors=recentColors.filter(c=>c.hex!==hex);
  recentColors.unshift({r:rr,g:gg,b:bb,hex});
  if(recentColors.length>20)recentColors.pop();
  localStorage.setItem('colorMixerRecent',JSON.stringify(recentColors));
  renderRecent();
  showToast(`Saved ${hex}!`);
}

function renderRecent(){
  const grid=document.getElementById('recent-grid');
  if(recentColors.length===0){
    grid.innerHTML='<span class="empty-msg">No colors saved yet — move sliders and tap Save!</span>';
    return;
  }
  grid.innerHTML='';
  for(const c of recentColors){
    const sw=document.createElement('div');
    sw.className='recent-swatch';sw.style.background=c.hex;sw.title=c.hex;sw.draggable=true;
    sw.addEventListener('click',()=>{applyColor(c.r,c.g,c.b);switchScreen('mixer');});
    sw.addEventListener('dragstart',e=>{dragSourceColor={r:c.r,g:c.g,b:c.b};e.dataTransfer.effectAllowed='copy';});
    grid.appendChild(sw);
  }
}

function buildSuggestions(){
  const grid=document.getElementById('suggest-grid');
  for(const s of SUGGESTIONS){
    const hex=toHex(s.r,s.g,s.b);
    const card=document.createElement('div');
    card.className='suggest-card';
    card.innerHTML=`<div class="suggest-swatch" style="background:${hex}"></div><div class="suggest-label">${s.label}</div><div class="suggest-hex">${hex}</div>`;
    card.addEventListener('click',()=>{applyColor(s.r,s.g,s.b);switchScreen('mixer');});
    grid.appendChild(card);
  }
}

// Drag & drop into mix zone
const previewEl=document.getElementById('preview');
previewEl.addEventListener('dragstart',e=>{dragSourceColor={r,g,b};e.dataTransfer.effectAllowed='copy';});
const mixZone=document.getElementById('mix-zone');
mixZone.addEventListener('dragover',e=>{e.preventDefault();mixZone.classList.add('drag-over');});
mixZone.addEventListener('dragleave',()=>mixZone.classList.remove('drag-over'));
mixZone.addEventListener('drop',e=>{
  e.preventDefault();mixZone.classList.remove('drag-over');
  if(!dragSourceColor)return;
  if(!mixSlot[0])mixSlot[0]={...dragSourceColor};
  else if(!mixSlot[1])mixSlot[1]={...dragSourceColor};
  else{mixSlot[0]=mixSlot[1];mixSlot[1]={...dragSourceColor};}
  renderMixZone();dragSourceColor=null;
});

function renderMixZone(){
  const prompt=document.getElementById('mix-prompt');
  const result=document.getElementById('mix-result');
  if(!mixSlot[0]&&!mixSlot[1]){prompt.style.display='';result.style.display='none';return;}
  prompt.style.display='none';result.style.display='flex';result.innerHTML='';
  mixZone.querySelectorAll('.mix-clear').forEach(b=>b.remove());

  const c1=mixSlot[0]||{r:0,g:0,b:0},c2=mixSlot[1];
  const chip1=document.createElement('div');
  chip1.className='mix-chip';chip1.style.background=toHex(c1.r,c1.g,c1.b);
  chip1.addEventListener('click',()=>{applyColor(c1.r,c1.g,c1.b);switchScreen('mixer');});
  result.appendChild(chip1);

  if(c2){
    const a1=document.createElement('div');a1.className='mix-arrow';a1.textContent='+';result.appendChild(a1);
    const chip2=document.createElement('div');chip2.className='mix-chip';chip2.style.background=toHex(c2.r,c2.g,c2.b);
    chip2.addEventListener('click',()=>{applyColor(c2.r,c2.g,c2.b);switchScreen('mixer');});result.appendChild(chip2);
    const a2=document.createElement('div');a2.className='mix-arrow';a2.textContent='=';result.appendChild(a2);
    const[mr,mg,mb]=blendColors(c1.r,c1.g,c1.b,c2.r,c2.g,c2.b);
    const mixHex=toHex(mr,mg,mb);
    const swatch=document.createElement('div');
    swatch.className='mix-result-swatch';swatch.style.background=mixHex;
    swatch.title='Tap to apply';
    swatch.addEventListener('click',()=>{applyColor(mr,mg,mb);saveToRecent(mr,mg,mb);switchScreen('mixer');showToast(`Mixed: ${mixHex}`);});
    result.appendChild(swatch);
    const lbl=document.createElement('div');
    lbl.style.cssText='color:var(--muted);font-size:0.75rem;text-align:center;';
    lbl.innerHTML=`<strong style="color:var(--text)">${mixHex}</strong><br>${getClosestName(mr,mg,mb)}`;
    result.appendChild(lbl);
  } else {
    const lbl=document.createElement('div');lbl.style.cssText='color:var(--muted);font-size:0.8rem;';
    lbl.textContent='Tap 🧪 Mix again to add a second color!';result.appendChild(lbl);
  }
  const clearBtn=document.createElement('button');
  clearBtn.className='mix-clear';clearBtn.textContent='✕ Clear';
  clearBtn.addEventListener('click',()=>{mixSlot=[null,null];renderMixZone();});
  mixZone.appendChild(clearBtn);
}

function makeParticles(){
  const container=document.getElementById('particles');
  const colors=['#ff6b6b','#a855f7','#3b82f6','#22c55e','#f59e0b','#ec4899'];
  const count=window.matchMedia('(max-width:640px)').matches?6:12;
  for(let i=0;i<count;i++){
    const p=document.createElement('div');p.className='particle';
    const size=Math.random()*50+15;
    p.style.cssText=`width:${size}px;height:${size}px;background:${colors[Math.floor(Math.random()*colors.length)]};left:${Math.random()*100}%;animation-duration:${Math.random()*20+15}s;animation-delay:${Math.random()*-20}s;`;
    container.appendChild(p);
  }
}

buildSuggestions();
renderRecent();
update();
makeParticles();
</script>
</body>
</html>
